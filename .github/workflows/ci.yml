# push/PR時に完了ゲート（test/typecheck/lint/build）を実行するCI。
# コマンド列は .claude/skills/full-check/SKILL.md と一致させる。
name: CI

on:
  push:
  pull_request:
    branches: [main]

# checkoutのみ行うため、デフォルトの広い権限を必要最小限に絞る。
permissions:
  contents: read

jobs:
  full-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Test
        run: npm test -- --runInBand

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
